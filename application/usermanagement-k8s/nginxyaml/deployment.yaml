apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginxlabel
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-container
        image: nginx 
        # 💡 Attention : Si tu laisses "Never", tu dois avoir buildé l'image toi-même. 
        # Si tu veux que Minikube la télécharge sur Internet, mets "IfNotPresent" à la place.
        imagePullPolicy: IfNotPresent 
        ports:
        - containerPort: 80 

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service-fixe
spec:
  type: NodePort
  selector:
    app: nginx # Indispensable : doit correspondre exactement au matchLabels du Deployment
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080 # Ton port fixe !
        
