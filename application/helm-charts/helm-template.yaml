  location: Mater, Bizerte, 001
---
# Source: user-management-backend-api/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: user-api-v1-user-management-backend-api
  labels:
    helm.sh/chart: user-management-backend-api-1.0.0
    app.kubernetes.io/name: user-management-backend-api
    app.kubernetes.io/instance: user-api-v1
    app.kubernetes.io/version: "1.16.0"
